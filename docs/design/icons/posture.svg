<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fractured shield posture icon</title>
<desc>A faceted amber-gold shield forged from angular plates, split by a glowing fracture, signaling instability at the breaking point.</desc>
<defs>
<linearGradient id="postureGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#4A3208"/>
<stop offset="45%" stop-color="#C79522"/>
<stop offset="58%" stop-color="#F2C24D"/>
<stop offset="100%" stop-color="#8A6414"/>
</linearGradient>
<filter id="postureGlow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="3.2"/>
</filter>
<filter id="postureGlowSoft" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="1.3"/>
</filter>
</defs>

<polygon points="50,6 77,19 75,50 67,72 50,94 33,72 25,50 23,19" fill="#3A2A08"/>
<polygon points="50,11 72,22 70,49 63,68 50,86 37,68 30,49 28,22" fill="url(#postureGrad)"/>

<polyline points="50,13 54,28 46,38 55,50 44,62 52,80" fill="none" stroke="#FFC65C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#postureGlow)"/>
<polyline points="50,13 54,28 46,38 55,50 44,62 52,80" fill="none" stroke="#FFE1A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#postureGlowSoft)"/>
<polyline points="50,13 54,28 46,38 55,50 44,62 52,80" fill="none" stroke="#FFF6DE" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

</svg>
