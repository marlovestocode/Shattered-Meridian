<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- STAMINA — tattered pennant with motion streaks, muted-green -->
  <line x1="10" y1="38" x2="30" y2="38" stroke="#6B9450" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="6" y1="50" x2="28" y2="50" stroke="#6B9450" stroke-width="4" opacity="0.55" stroke-linecap="round"/>
  <line x1="10" y1="62" x2="28" y2="62" stroke="#6B9450" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <!-- pole -->
  <rect x="30" y="16" width="5" height="76" fill="#2C3B24"/>
  <!-- pennant body, jagged trailing edge -->
  <polygon points="35,22 78,34 66,50 80,60 60,72 35,80" fill="#3E5330"/>
  <polygon points="35,25 72,35 62,49 74,58 57,68 35,75" fill="#6B9450"/>
  <!-- tear / chip -->
  <polygon points="62,49 68,52 63,56 60,52" fill="#0D1117"/>
  <!-- worn highlight seam -->
  <polyline points="37,28 60,36 52,48 64,56 46,66" fill="none" stroke="#C9E4B8" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
</svg>
