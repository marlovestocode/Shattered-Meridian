<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Attribute points dial arc</title>
<desc>A 96x96 gauge ring at radius 38 with a 3px round-capped stroke, opened by a 28 percent gap centered on the bottom, drawn as an explicit arc path with a dim track and a violet-to-bronze gradient progress arc stacked on top of it.</desc>

<!-- SCALE: 1 SVG unit = 1 CSS pixel, matching the design's own 96x96 SVG box exactly.
     See hex-lattice-tile.svg for this batch's comment-style note.

     GEOMETRY:
       circumference = 2 * pi * 38 = 238.76
       gap           = 28% of that = 66.85, which is 100.8 degrees
       arc           = the remaining 259.2 degrees
       centering the gap on the bottom puts the arc's ends at 140.4 and 39.6 degrees, measured
       from 3 o'clock and running clockwise, which works out to the two symmetric endpoints
       18.72,72.22 and 77.28,72.22

     WHY AN EXPLICIT ARC PATH RATHER THAN THE SPEC'S stroke-dasharray. This was rewritten after a
     rendered proof, not on theory. The spec's construction is a full circle carrying
     dasharray "172 239" with a negative dashoffset. Two things are wrong with porting that
     literally:

     1. The dash pattern's period is 172 + 239 = 411, which is LONGER than the circle's own 238.76.
        A dash that would have to wrap past path distance 0 to close does not wrap; it is truncated
        at the seam. Rendered, the spec's own numbers produce a lopsided arc whose right end stops
        dead at 3 o'clock. A bottom-centered opening is not expressible as a single dash on an
        unrotated circle for exactly this reason: the visible arc has to straddle the seam.
     2. The spec pairs those numbers with a rotate(-90) on the SVG. Worked through, that combination
        puts the roughly 100 degree opening at the TOP, contradicting the same spec's prose
        ("opening at the bottom") and the brief. This file follows the stated intent: opening at the
        bottom, which is the conventional gauge read and leaves the top of the ring uninterrupted
        above the centered value stack.

     An explicit arc has neither problem, and it also drops the rotate transform, which matters for
     the gradient: a userSpaceOnUse gradient lives in the element's own user space, so rotating the
     element would drag the violet-to-bronze axis around with it.

     PARTIAL FILL: the progress path carries pathLength="100", so its dasharray is simply the
     percentage. fraction = pointsSpent / 18.
       18/18 gives stroke-dasharray="100 100"     (as drawn below)
       13/18 gives stroke-dasharray="72.2 100"
        0/18 gives stroke-dasharray="0 100"       (draws nothing) -->

<defs>
  <linearGradient id="dialGrad" gradientUnits="userSpaceOnUse" x1="12" y1="12" x2="84" y2="84">
    <stop offset="0" stop-color="#9a88c8"/>
    <stop offset="1" stop-color="#c4a46e"/>
  </linearGradient>
</defs>

<!-- track: the full gap-arc at 4% white -->
<path d="M 18.72,72.22 A 38,38 0 1 1 77.28,72.22"
      fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="3" stroke-linecap="round"/>

<!-- progress: identical geometry, gradient stroke, shown here at 18/18 -->
<path d="M 18.72,72.22 A 38,38 0 1 1 77.28,72.22" pathLength="100"
      fill="none" stroke="url(#dialGrad)" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="100 100"/>
</svg>
